openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Public menu operations
  - name: orders
    description: Customer orders and staff payment confirmation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /menu-items:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List orderable menu items
      responses:
        "200":
          description: Orderable menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for staff review
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a bank transfer order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{orderNumber}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by its customer-facing reference
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{orderNumber}/payment:
    patch:
      operationId: updateOrderPayment
      tags: [orders]
      summary: Confirm or reject an order payment
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MenuItem:
      type: object
      required:
        - id
        - name
        - category
        - description
        - price
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        price:
          type: integer
          minimum: 0
    OrderItemInput:
      type: object
      required:
        - menuItemId
        - quantity
      properties:
        menuItemId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 20
    OrderItem:
      type: object
      required:
        - menuItemId
        - name
        - quantity
        - unitPrice
        - lineTotal
      properties:
        menuItemId:
          type: string
        name:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer
        lineTotal:
          type: integer
    OrderInput:
      type: object
      required:
        - customerName
        - customerPhone
        - fulfillmentMethod
        - items
      properties:
        customerName:
          type: string
          minLength: 2
        customerPhone:
          type: string
          minLength: 7
        fulfillmentMethod:
          type: string
          enum: [delivery, pickup]
        deliveryAddress:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
    PaymentUpdate:
      type: object
      required:
        - paymentStatus
      properties:
        paymentStatus:
          type: string
          enum: [confirmed, rejected]
        staffNote:
          type: ["string", "null"]
    Order:
      type: object
      required:
        - orderNumber
        - customerName
        - customerPhone
        - fulfillmentMethod
        - deliveryAddress
        - notes
        - items
        - subtotal
        - deliveryFee
        - total
        - paymentMethod
        - paymentStatus
        - orderStatus
        - staffNote
        - createdAt
        - updatedAt
      properties:
        orderNumber:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
        fulfillmentMethod:
          type: string
          enum: [delivery, pickup]
        deliveryAddress:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: integer
        deliveryFee:
          type: ["integer", "null"]
        total:
          type: integer
        paymentMethod:
          type: string
          enum: [bank_transfer]
        paymentStatus:
          type: string
          enum: [pending, confirmed, rejected]
        orderStatus:
          type: string
          enum: [awaiting_payment, preparing, ready, completed, cancelled]
        staffNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

